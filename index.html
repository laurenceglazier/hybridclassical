<head>

  <title>Hybrid Classical – Virtual Conductor</title>

  <style>
    body {
      font-family: sans-serif;
      padding: 2em;
      background: #fff;
      color: #000;
    }

    /* HC3 unified player */
    #hc3-player {
      background-color: #fff;
    }

    .logo-and-version-container {
      text-align: center;
    }

    .logo-container img {
      max-width: 50%;
      height: auto;
      margin: 0 auto;
      display: block;
    }

    input[type="file"],
    input[type="range"],
    button {
      margin-top: 1em;
      padding: 0.5em;
      font-size: 1em;
    }

    #log,
    #rateDisplay {
      white-space: pre-wrap;
      font-family: monospace;
      background: #f4f4f4;
      color: #000;
      padding: 1em;
      border-radius: 8px;
      margin-top: 1em;
    }

    audio {
      margin-top: 1em;
      width: 100%;
    }

    .tempo-icon {
      font-size: 1.8em;
      display: inline-block;
      position: relative;
      top: 0.2em;
      margin: 0 0.6em;
      line-height: 1;
    }

    .flipped {
      transform: scaleX(-1);
      display: inline-block;
    }

    #gestureButton {
      background-color: #ddd;
      color: #000;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #gestureButton:hover {
      background-color: #ccc;
    }

    #tempoControl {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 1em;
    }

    #tempoControl button {
      min-width: 2.5em;
      background-color: #ddd;
      color: #000;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #tempoControl button:hover {
      background-color: #ccc;
    }

    /* === HC header (logo + QR) — single source of truth === */
    :root {
      --brandHeight: 200px;
      /* one knob for both images */
      --sidePadding: 16px;
      /* equal edge padding */
      --brandGap: var(--sidePadding);
      /* middle gap = edges (nice symmetry) */
      --qrQuiet: 12px;
      /* white quiet zone for fast scans */
    }

    /* Topbar (currently disabled
    #hc-topbar {
      display: flex;
      align-items: center;
      justify-content: space-evenly;

    */

    /* logo left, QR right */

    /* 
      gap: var(--brandGap);
      padding: 8px var(--sidePadding);
      border-bottom: 1px solid #eee;
    }


    #hc-logo,
    #hc-qr {
      height: var(--brandHeight) !important;
      width: auto !important;
      display: block;
    }

    #hc-qr {
      background: #fff;
      padding: var(--qrQuiet);

    */

    /* quiet zone around modules */

    /*
      border: 1px solid #ddd;
      border-radius: 6px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    */

    /* Compact phones */
    @media (max-width: 375px) {
      :root {
        --brandHeight: 168px;
      }
    }

    @media (max-width: 340px) {
      :root {
        --brandHeight: 148px;
      }
    }

    /* Large, friendly Play/Pause button */
    .hc-big {
      font-size: 2.4rem;
      padding: 0.6rem 1rem;
      border-radius: 999px;
      line-height: 1;
      cursor: pointer;
      margin-bottom: 10px;
      /* space above the audio bar */
    }

    /* Make it larger on touch devices (phones, Vision Pro, tablets) */
    @media (pointer: coarse) {
      .hc-big {
        font-size: 3rem;
        padding: 0.75rem 1.1rem;
      }
    }

    .is-disabled {
      pointer-events: none;
      opacity: .55;
    }

    [aria-disabled="true"] {
      pointer-events: none;
      opacity: .55;
    }
  </style>
</head>

  <script>

    // If your loader is named differently, change this to call yours.
    // HC3 Map: Can use from HC Library and Load From URL functions





    function loadFromUrl() {
      const url = document.getElementById("urlInput").value.trim();
      const player = document.getElementById("hc3-player");   // ← note the hyphen

      if (!url) {
        alert("Please paste a valid URL.");
        return;
      }

      if (!player) {
        console.warn("hc3-player element not found");
        return;
      }

      console.log("Loading:", url);
      player.src = url;
      player.play().catch(err => console.warn("Autoplay failed:", err));
    }

    function openLibraryPicker(e) {
      e.preventDefault(); // don't follow the link directly
      const pickerUrl = document.getElementById('openLibrary').getAttribute('href');
      // Open a real new tab/window and keep a reference so we can close it later.
      const lib = window.open(pickerUrl, '_blank'); // no rel=noopener here


      function onMsg(ev) {
        console.log('[HC] message from library:', ev.origin, ev.data);

        const allowedOrigins = [
          'https://www.hybridclassical.ai',
          'https://hybridclassical.ai'
        ];

        if (!allowedOrigins.includes(ev.origin)) {
          console.warn('[HC] Ignoring message from unexpected origin:', ev.origin);
          return;
        }


        //==================
        /*
                const msg = ev.data || {};
                if (msg.type === 'HC_SELECT_URL' && msg.url) {
                  hc3LoadFromURL(msg.url);
                  try {
                    if (typeof setShareUrl === 'function') setShareUrl(msg.url);
                  } catch (_) { }
        
                  try { lib && lib.close(); } catch (_) { }
                  window.removeEventListener('message', onMsg);
                }
        */
        //===================

        const msg = ev.data || {};
        if (msg.type === 'HC_SELECT_URL' && msg.url) {
          let rawUrl = msg.url;
          let mediaUrl = rawUrl;

          try {
            const u = new URL(rawUrl);

            // If this is one of our /track/?id=... links, map it to the real MP3
            const id = u.searchParams.get('id');
            if (u.pathname.includes('/track') && id) {
              const safeId = id.trim().replace(/[^a-zA-Z0-9/_\-.]/g, '');
              mediaUrl = `https://laurenceglazier.github.io/hc-tracks/audio/${safeId}`;
            }
          } catch (e) {
            console.warn('[HC] Could not parse library URL, using raw URL:', e);
          }

          console.log('[HC] resolved library media URL:', mediaUrl);

          hc3LoadFromURL(mediaUrl);

          // Update the shareable ?u= link with the *direct* media URL
          try {
            if (typeof setShareUrl === 'function') setShareUrl(mediaUrl);
          } catch (_) { }

          try { lib && lib.close(); } catch (_) { }
          window.removeEventListener('message', onMsg);
        }


      }

      window.addEventListener('message', onMsg);

    }

    document.getElementById('openLibrary').addEventListener('click', openLibraryPicker);

    // Optional deep-linking helper; harmless if you add later.
    function setShareUrl(srcUrl) {
      const u = new URL(window.location.href);
      u.searchParams.set('u', srcUrl);
      history.replaceState(null, '', u);
    }
  </script>

    const audioInput = document.getElementById('audioInput');

    const rateDisplay = document.getElementById('rateDisplay');

    const log = document.getElementById('log');
    const tempoUp = document.getElementById('tempoUp');
    const tempoDown = document.getElementById('tempoDown');

    const DEAD_ZONE = 5;
    const GAMMA_MIN = -30;
    const GAMMA_MAX = 30;
    const RATE_MIN = 0.5;
    const RATE_MAX = 2.0;
    const UPDATE_INTERVAL = 100;
    const NUDGE_STEP = 0.01;

    let gestureEnabled = false;
    let lastUpdateTime = 0;
    let nudgeInterval = null;

    function updatePlaybackRate(rate) {
      hc3Player.playbackRate = rate;
      tempoSlider.value = rate.toFixed(2);
      rateDisplay.textContent = rate.toFixed(2) + '×';
    }

    function adjustTempo(change) {
      let newRate = parseFloat(tempoSlider.value) + change;
      newRate = Math.max(RATE_MIN, Math.min(RATE_MAX, newRate));
      updatePlaybackRate(newRate);
    }

    function startNudge(change) {
      adjustTempo(change);
      nudgeInterval = setInterval(() => adjustTempo(change), 100);
    }

    function stopNudge() {
      clearInterval(nudgeInterval);
    }

    tempoUp.addEventListener('mousedown', () => startNudge(NUDGE_STEP));
    tempoUp.addEventListener('touchstart', () => startNudge(NUDGE_STEP));
    tempoDown.addEventListener('mousedown', () => startNudge(-NUDGE_STEP));
    tempoDown.addEventListener('touchstart', () => startNudge(-NUDGE_STEP));
    document.addEventListener('mouseup', stopNudge);
    document.addEventListener('touchend', stopNudge);


    audioInput.addEventListener('change', (event) => {
      const file = event.target.files?.[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      const name = file.name || '';

      // Unified HC3 path
      hc3LoadFromURL(url);

      updatePlaybackRate(1.0);
      showCurrentTrack(name);
    });


    tempoSlider.addEventListener('input', () => {
      const rate = parseFloat(tempoSlider.value);
      updatePlaybackRate(rate);
    });

    function calculatePlaybackRate(gamma) {
      if (Math.abs(gamma) < DEAD_ZONE) return 1.0;
      const clamped = Math.max(GAMMA_MIN, Math.min(GAMMA_MAX, gamma));
      const percent = (clamped - GAMMA_MIN) / (GAMMA_MAX - GAMMA_MIN);
      return RATE_MIN + (RATE_MAX - RATE_MIN) * percent;
    }

    function setupGestureControl() {
      window.addEventListener('deviceorientation', (event) => {
        const now = Date.now();
        if (!gestureEnabled || now - lastUpdateTime < UPDATE_INTERVAL) return;

        const gamma = event.gamma ?? 0;
        const beta = event.beta ?? 0;
        const rate = calculatePlaybackRate(gamma);
        const rounded = rate.toFixed(2);

        log.textContent =
          `gamma: ${gamma.toFixed(2)}°\n` +
          `beta:  ${beta.toFixed(2)}°\n` +
          `mapped playbackRate: ${rounded}`;

        updatePlaybackRate(rate);
        lastUpdateTime = now;
      });
    }

    gestureButton.addEventListener('click', () => {
      if (!gestureEnabled) {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission()
            .then(response => {
              if (response === 'granted') {
                gestureEnabled = true;
                gestureButton.textContent = 'Disable Gesture Control';
              }
            })
            .catch(err => console.error(err));
        } else {
          gestureEnabled = true;
          gestureButton.textContent = 'Disable Gesture Control';
        }
      } else {
        gestureEnabled = false;
        gestureButton.textContent = 'Enable Gesture Control';
      }
    });

  <script>
    /* Minimal, robust MP4 wiring: helpers + Big Play + tempo mirror */
    (function () {
      const audio = document.getElementById('audioPlayer');
      const video = document.getElementById('videoPlayer');
      const big = document.getElementById('bigPlay');
      const tempo = document.getElementById('tempoSlider');
      if (!audio || !video || !big) return;

      // Keep pitch constant if the browser supports it
      function keepPitch(el) {
        try { el.preservesPitch = true; } catch (_) { }
        try { el.webkitPreservesPitch = true; } catch (_) { }
        try { el.mozPreservesPitch = true; } catch (_) { }
      }
      keepPitch(audio); keepPitch(video);

      // Track which element Big Play should control
      let current = 'audio';

      function stopAll() {
        try { audio && audio.pause(); } catch (_) { }
        try { video && video.pause(); } catch (_) { }
      }



      function showAudio() {
        // stop + fully unload the video so its audio can't keep playing
        stopAll();
        if (video) {
          video.removeAttribute('src');   // detach stream
          try { video.load(); } catch (_) { }
          video.style.display = 'none';
        }
        // show audio
        if (audio) {
          audio.style.display = '';
        }
        current = 'audio';
      }


      function showVideo() {
        // stop + fully unload the audio so it can't keep playing
        stopAll();
        if (audio) {
          audio.removeAttribute('src');   // detach stream
          try { audio.load(); } catch (_) { }
          audio.style.display = 'none';
        }
        // show video
        if (video) {
          video.style.display = '';
          video.removeAttribute('height'); // avoid tiny letterboxing
        }
        current = 'video';
      }




      // Helpers used by "Open from URL" and the file picker


      window.hcUseAudio = function (url) {
        showAudio();
        if (audio) {
          audio.src = url;
          try { audio.load(); } catch (_) { }
        }
      };

      window.hcUseVideo = function (url) {
        showVideo();
        if (video) {
          video.src = url;
          try { video.load(); } catch (_) { }
        }
      }






      // If either starts playing, remember which is active
      audio.addEventListener('play', () => current = 'audio');
      video.addEventListener('play', () => current = 'video');


      // Mirror tempo to video when video is active (audio already handled elsewhere)
      if (tempo) {
        tempo.addEventListener('input', () => {
          if (current === 'video') {
            const r = parseFloat(tempo.value) || 1;
            video.playbackRate = r;
          }
        });
      }

      // Unified Big Play: always controls the active player (audio or video)
      big.addEventListener('click', function (e) {
        // prevent any older handlers from firing
        e.stopImmediatePropagation();

        if (current === 'video') {
          if (video.paused) { video.play().catch(() => { }); } else { video.pause(); }
        } else {
          if (audio.paused) { audio.play().catch(() => { }); } else { audio.pause(); }
        }

        // optional glyph sync
        try {
          const el = (current === 'video') ? video : audio;
          big.textContent = el.paused ? '▶︎' : '⏸';
        } catch (_) { }
      }, true); // capture phase




    })();
